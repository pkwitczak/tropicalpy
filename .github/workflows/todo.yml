name: Generate issues for TODOs
on: [push, pull_request]
jobs:
  create-todo-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write  # explicitly allow issue writing
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # pass token as GH_TOKEN
      GH_REPO: ${{ github.repository }}     # set repo for gh commands
    steps:
      - uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: sudo apt install -y gh

      - name: Scan for TODOs and create issues
        run: |
          set -eux  # enable debugging and error exit
          for ext in "py" "pyx"; do
            echo "Searching *.$ext files..."
            find . -name "*.$ext" -not -path "./build/*" -exec sh -c '
              for file in "$@"; do
                if grep -l "TODO:" "$file" > /dev/null; then
                  echo "File: $file"
                  grep -n "TODO:" "$file" | while read -r line; do
                    line_number=$(echo "$line" | cut -d: -f1)
                    todo_text=$(echo "$line" | sed -n "s/.*TODO:[[:space:]]*//p")
                    echo "Creating GitHub issue for TODO: $todo_text"
                    # No error suppression so you can see problems
                    gh issue create --title "$todo_text" --body "" || true
                  done
                fi
              done
            ' sh {} +
          done

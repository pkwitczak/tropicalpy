name: Create TODO Issues
on:  [push]

jobs:
  create-todo-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up GitHub CLI
        uses: cli/cli@v3 # Official GitHub CLI Action (optional if CLI already installed)

      - name: Scan for TODOs and create issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ext in "py" "pyx"; do
            echo "Searching *.$ext files..."
            find . -name "*.$ext" -not -path "./build/*" -exec sh -c '
              for file in "$@"; do
                if grep -l "TODO:" "$file" > /dev/null; then
                  echo "File: $file"
                  grep -n "TODO:" "$file" | while read -r line; do
                    line_number=$(echo "$line" | cut -d: -f1)
                    todo_text=$(echo "$line" | sed -n "s/.*TODO:[[:space:]]*//p")
                    echo "Creating GitHub issue for TODO: $todo_text"
                    gh issue create --title "$todo_text" --body "" --repo ${{ github.repository }} --token $GITHUB_TOKEN || echo "Issue creation failed or duplicate"
                  done
                fi
              done
            ' sh {} +
          done

name: "TODO to Issue"
on: ["push"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Show TODOs
        run: |
          echo "=== TODOs in Python files ==="
          find . -name "*.py" -not -path "./build/*" -exec grep -l "TODO" {} \; || true
          echo -e "\n=== TODOs in Cython files ==="
          find . -name "*.pyx" -not -path "./build/*" -exec grep -l "TODO" {} \; || true
          echo -e "\n=== TODOs in Markdown files ==="
          find . -name "*.md" -exec grep -l "TODO" {} \; || true
          
      - name: TODO to Issue
        uses: "alstr/todo-to-issue-action@v4.6"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          CLOSE_ISSUES: true
          AUTO_P: true
          AUTO_ASSIGN: true
          LABEL: "todo"
          COMMENT_MARKER: "#"
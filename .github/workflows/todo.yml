name: "TODO to Issue"
on: ["push"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Show TODOs with Context
        run: |
          echo "=== TODOs in Python/Cython files ==="
          for ext in "py" "pyx"; do
            find . -name "*.$ext" -not -path "./build/*" -exec sh -c '
              for file in "$@"; do
                if grep -l "TODO" "$file" > /dev/null; then
                  echo "File: $file"
                  grep -n "TODO" "$file" | while read -r line; do
                    echo "  $line"
                  done
                fi
              done
            ' sh {} + || true
          done
          
          echo -e "\n=== TODOs in Markdown files ==="
          find . -name "*.md" -exec sh -c '
            for file in "$@"; do
              if grep -l "TODO" "$file" > /dev/null; then
                echo "File: $file"
                grep -n "TODO" "$file"
              fi
            done
          ' sh {} + || true
          
      - name: TODO to Issue
        uses: "alstr/todo-to-issue-action@v4.6"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          CLOSE_ISSUES: true
          AUTO_P: true
          AUTO_ASSIGN: true
          LABEL: "todo"
          COMMENT_MARKER: "#"
          IGNORE: "build/,dist/"
name: Generate issues for TODOs
on: [push, pull_request]
jobs:
  create-todo-issues:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh
          gh --version

      - name: Scan for TODOs and create issues without duplicates
        run: |
          set -eux
          for ext in "py" "pyx"; do
            echo "Searching *.$ext files..."
            find . -name "*.$ext" -not -path "./build/*" -exec sh -c '
              for file in "$@"; do
                if grep -l "TODO:" "$file" > /dev/null; then
                  echo "File: $file"
                  grep -n "TODO:" "$file" | while read -r line; do
                    todo_text=$(echo "$line" | sed -n "s/.*TODO:[[:space:]]*//p")
                    echo "TODO text: \"$todo_text\""
                    if [ -z "$todo_text" ]; then
                      echo "Skipping empty TODO"
                      continue
                    fi
                    issue_exists=$(gh issue list --repo "$GH_REPO" --state open --search "$todo_text" --json number,title --jq ".[] | select(.title==\"$todo_text\") | .number" || echo "")
                    if [ -n "$issue_exists" ]; then
                      echo "Issue already exists for TODO: $todo_text, skipping."
                    else
                      echo "Creating GitHub issue for TODO: $todo_text"
                      gh issue create --title "$todo_text" --body "" --repo "$GH_REPO"
                    fi
                  done
                fi
              done
            ' sh {} +
          done
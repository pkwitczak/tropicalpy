name: "TODO to Issue"
on: ["push"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
          
      - name: Show TODOs with Context
        id: todo-find
        run: |
          echo "=== TODOs in Python/Cython files ==="
          for ext in "py" "pyx"; do
            echo "Searching *.$ext files..."
            find . -name "*.$ext" -not -path "./build/*" -exec sh -c '
              for file in "$@"; do
                if grep -l "TODO:" "$file" > /dev/null; then
                  echo "File: $file"
                  grep -n "TODO:" "$file" | while read -r line; do
                    line_number=$(echo "$line" | cut -d: -f1)
                    # Extract the text after "TODO:" (trim leading spaces)
                    todo_text=$(echo "$line" | sed -n "s/.*TODO:[[:space:]]*//p")
                    echo "Creating GitHub issue for TODO: $todo_text"
                    gh issue create --title "$todo_text" --body ""
                  done
                fi
              done
            ' sh {} + || true
          done

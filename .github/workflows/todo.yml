name: "TODO to Issue"
on: ["push"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Show TODOs before action
        run: |
          echo "TODOs found in Python files:"
          grep -r "TODO" . --include="*.py" --include="*.pyx" || true
          echo -e "\nTODOs found in Markdown files:"
          grep -r "TODO" . --include="*.md" || true
      - name: TODO to Issue
        uses: alstr/todo-to-issue-action@master
        id: todo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          CLOSE_ISSUES: true
          AUTO_P: true
          AUTO_ASSIGN: true
          IDENTIFIERS: '[{"name": "TODO", "labels": ["todo"]}, {"name": "FIXME", "labels": ["fix"]}]'
          LANGUAGES: "python,markdown"
          GITHUB_URL: "https://github.com"
          GITHUB_SERVER_URL: "https://github.com"